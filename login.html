<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login — Innoloom</title><link rel="stylesheet" href="css/styles.css"></head>
<body data-page="login"><header id="site-header"></header><main class="auth-shell"><section class="auth-card"><div class="auth-heading"><img class="auth-logo" src="assets/innoloom-logo.png" alt="Innoloom logo"><div><p class="eyebrow">Welcome back</p><h1>Login to Innoloom</h1></div></div><form id="login-form" novalidate><div class="form-group"><label for="login-email">Email</label><input id="login-email" type="email" required autocomplete="email"><small class="field-error"></small></div><div class="form-group"><label for="login-password">Password</label><input id="login-password" type="password" required autocomplete="current-password"><small class="field-error"></small></div><div class="role-switch"><label><input type="radio" name="role" value="student" checked> Student</label><label><input type="radio" name="role" value="teacher"> Teacher</label></div><div class="button-row"><button class="btn btn-primary" type="submit">Login →</button><a class="text-link" href="signup.html">Create an account</a></div><p id="login-message" class="form-message"></p></form></section></main><footer id="site-footer"></footer><script src="js/app.js"></script></body></html>
