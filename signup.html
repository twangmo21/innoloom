<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign Up — Innoloom</title><link rel="stylesheet" href="css/styles.css"></head>
<body data-page="signup"><header id="site-header"></header><main class="auth-shell"><section class="auth-card wide"><div class="auth-heading"><img class="auth-logo" src="assets/innoloom-logo.png" alt="Innoloom logo"><div><p class="eyebrow">Start learning</p><h1>Create your Innoloom account</h1></div></div><form id="signup-form" novalidate><div class="form-grid"><div class="form-group"><label>Name</label><input id="signup-name" name="name" required minlength="2" maxlength="80"><small class="field-error"></small></div><div class="form-group"><label>School</label><input id="signup-school" name="school" required minlength="2" maxlength="120"><small class="field-error"></small></div><div class="form-group"><label>Gender</label><select id="signup-gender" name="gender" required><option value="">Choose</option><option>Male</option><option>Female</option><option>Prefer not to say</option></select><small class="field-error"></small></div><div class="form-group"><label>Email</label><input id="signup-email" name="email" type="email" required><small class="field-error"></small></div><div class="form-group"><label>Teacher or student</label><select id="signup-role" name="role" required><option value="student">Student</option><option value="teacher">Teacher</option></select><small class="field-error"></small></div><div class="form-group full" id="teacher-code-group" hidden><label for="signup-teacher-code">Teacher registration code</label><input id="signup-teacher-code" name="teacherCode" type="password" autocomplete="off" placeholder="Enter the shared teacher code" disabled><small class="field-hint">This code is required only for teacher accounts.</small><small class="field-error"></small></div><div class="form-group"><label>Create password</label><input id="signup-password" name="password" type="password" required autocomplete="new-password"><small class="field-hint">Use at least 10 characters, including uppercase and lowercase letters, a number and a symbol.</small><small class="field-error"></small></div><div class="form-group"><label>Confirm password</label><input id="signup-confirm" name="confirmPassword" type="password" required><small class="field-error"></small></div><div class="form-group full"><label>About you (optional)</label><textarea id="signup-bio" name="bio" rows="4" maxlength="500"></textarea><small class="field-error"></small></div></div><div class="button-row"><button class="btn btn-primary" type="submit">Submit</button><a class="text-link" href="login.html">Already have an account?</a></div><p id="signup-message" class="form-message"></p></form></section></main><footer id="site-footer"></footer><script src="js/app.js"></script></body></html>
