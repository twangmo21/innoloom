<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teacher Dashboard — Innoloom</title><link rel="stylesheet" href="css/styles.css"></head>
<body data-page="teacher"><header id="site-header"></header><main class="page-shell"><section class="page-heading"><p class="eyebrow">Teacher dashboard</p><h1>Create class & monitor learning</h1><p>Add a class, assign students by email, and check student progress.</p></section><div class="teacher-grid"><section class="panel"><div class="panel-head"><h2>Create class</h2><span class="pill">Teacher only</span></div><form id="class-form"><div class="form-group"><label>Class / section</label><input id="class-name" required placeholder="e.g. Class IX A"></div><button class="btn btn-primary" type="submit">Create class</button><p id="class-message" class="form-message"></p></form><div id="class-list" class="class-list"></div></section><section class="panel"><div class="panel-head"><h2>Add student</h2></div><form id="student-form"><div class="form-group"><label>Student email</label><input id="student-email" type="email" required placeholder="student@example.com"></div><div class="form-group"><label>Class</label><select id="student-class" required></select></div><button class="btn btn-primary" type="submit">+ Add Student</button><p id="student-message" class="form-message"></p></form></section></div><section class="panel"><div class="panel-head"><h2>Student progress</h2><span id="teacher-summary" class="muted"></span></div><div class="table-wrap"><table><thead><tr><th>Name</th><th>Email</th><th>Status</th><th>Progress</th><th>Badges</th></tr></thead><tbody id="student-progress-rows"></tbody></table></div></section></main><footer id="site-footer"></footer><script src="js/app.js"></script></body></html>
